[workspace]
resolver = "2"
members = ["crates/kosha-core", "crates/kosha-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/shatyrko/kosha"

[workspace.dependencies]
kosha-core = { path = "crates/kosha-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package]
name = "kosha-core"
description = "Dictionary engine for Kosha: reads ABBYY Lingvo DSL files in place (plain or dictzip), indexes headwords, renders articles"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
unicode-normalization = "0.1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

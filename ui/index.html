<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kosha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" data-mode="dictionary">
    <aside id="side">
      <div class="tabs" role="tablist" aria-label="Kosha">
        <button id="tab-dict" class="tab on" role="tab" aria-selected="true" title="Dictionary (Ctrl+1)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg>
          Dictionary
        </button>
        <button id="tab-cards" class="tab" role="tab" aria-selected="false" title="Word cards (Ctrl+2)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10A1.5 1.5 0 0 1 18.5 6v12A1.5 1.5 0 0 1 17 19.5H7A1.5 1.5 0 0 1 5.5 18V6A1.5 1.5 0 0 1 7 4.5zM9 9h6M9 12.5h6M9 16h3.5"/></svg>
          Cards <span id="cards-badge" class="badge"></span>
        </button>
      </div>

      <!-- dictionary: search and headwords -->
      <div class="side-dict">
        <div class="search">
          <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search the dictionaries">
          <button id="clear" class="icon-btn" title="Clear (Esc)" aria-label="Clear" hidden>
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <ul id="results" role="listbox" aria-label="Headwords"></ul>
      </div>

      <!-- cards: the folder tree -->
      <div class="side-cards">
        <div class="search">
          <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input id="card-filter" type="search" placeholder="Filter cards" autocomplete="off" spellcheck="false" aria-label="Filter the cards">
        </div>
        <ul id="folder-tree" aria-label="Folders"></ul>
        <div class="tree-foot">
          <button id="new-folder" class="text-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New folder
          </button>
        </div>
      </div>

      <div id="side-foot">
        <button id="open-settings" class="icon-btn" title="Settings (Ctrl+,)" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button id="dict-status" class="text-btn" title="Dictionaries">Opening dictionaries…</button>
      </div>
    </aside>

    <!-- dictionary: articles -->
    <main id="main" class="main-dict">
      <header id="bar">
        <button id="back-list" class="icon-btn narrow-only" title="Results" aria-label="Back to results">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button id="back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button id="forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
        </button>
        <h1 id="word"></h1>
      </header>
      <div id="articles" tabindex="-1"></div>
    </main>

    <!-- cards: the cards of the chosen folder -->
    <main id="cards-main" class="main-cards">
      <header class="cards-bar">
        <div class="grow">
          <h1 id="cards-title">All cards</h1>
          <div id="cards-count" class="sub"></div>
        </div>
        <label id="deep-label" class="check small" title="Also the cards of the folders inside">
          <input id="deep" type="checkbox" checked> With sub-folders
        </label>
        <button id="folder-more" class="icon-btn" title="Folder actions" aria-label="Folder actions">
          <svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
        </button>
        <button id="study" class="btn primary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          Study
        </button>
      </header>
      <div id="card-grid"></div>
    </main>

    <section id="settings" hidden aria-label="Settings">
      <nav class="settings-nav" aria-label="Settings sections"></nav>
      <div class="settings-main">
        <button id="close-settings" class="icon-btn close-x close-btn" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="settings-body"></div>
      </div>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
